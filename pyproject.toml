[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-vercel-insights"
version = "1.1.1"
description = "Read-only OpenClaw skill for querying Vercel request logs, Web Analytics and Speed Insights."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT-0"
license-files = ["LICENSE"]
keywords = [
  "vercel",
  "analytics",
  "web-analytics",
  "speed-insights",
  "web-vitals",
  "logs",
  "runtime-logs",
  "openclaw",
  "skill",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Typing :: Typed",
]
# The floor is a security floor, not a feature floor: nothing here needs an API
# newer than 2.28. Every published advisory against requests is fixed by 2.33.0,
# the most recent being GHSA-gc5v-m9x4-r6x2 (insecure temp file reuse in
# extract_zipped_paths). Raise it when a new advisory lands, not otherwise, and
# check that requires-python above still matches: 2.33.0 needs >=3.10, the same
# floor this project sets.
dependencies = ["requests>=2.33.0"]

[project.optional-dependencies]
# The upper bounds are deliberate: ruff and mypy both add diagnostics in new
# releases, so an unbounded range can turn CI red without a code change. Raise
# them on purpose, in a pull request that also fixes whatever the new version
# reports.
dev = [
  "pytest>=7.4",
  "ruff>=0.6,<0.17",
  "mypy>=1.11,<3",
  "types-requests>=2.31",
]

[project.scripts]
# `pip install -e .` puts a `vercel-insights` command on PATH. It is the same
# entry point as `python3 -m vercel_insights`, which keeps working uninstalled.
vercel-insights = "vercel_insights.cli:main"

[project.urls]
Homepage = "https://github.com/anatoli-iliev/openclaw-vercel-insights"
Source = "https://github.com/anatoli-iliev/openclaw-vercel-insights"
Issues = "https://github.com/anatoli-iliev/openclaw-vercel-insights/issues"

# The skill ships as one importable package at the repository root. Listing it
# explicitly keeps auto-discovery from sweeping in tests/, docs/ or examples/.
[tool.setuptools]
packages = ["vercel_insights"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]
ignore = [
  # Every zip() in the package pairs sequences that are built from one another
  # in the same function, so the lengths cannot diverge and `strict=` would
  # only add noise.
  "B905",
  # An if/else block is often clearer than a ternary for the multi-line
  # branches this codebase uses.
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
# tests/conftest.py puts the repository root on sys.path before importing the
# package under test, so that import cannot sit at the top of the file.
"tests/*" = ["E402"]

[tool.mypy]
strict = true
python_version = "3.10"
# The package is not installed during a plain checkout, so point mypy at the
# repository root: that is what makes `import vercel_insights` resolve from the
# tests as well as from the package itself.
mypy_path = "."
files = ["vercel_insights", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
