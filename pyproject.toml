[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-vercel-analytics"
version = "0.1.0"
description = "Read-only OpenClaw skill for querying the Vercel Web Analytics API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT-0"
license-files = ["LICENSE"]
keywords = ["vercel", "analytics", "web-analytics", "openclaw", "skill", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Typing :: Typed",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
# The upper bounds are deliberate: ruff and mypy both add diagnostics in new
# releases, so an unbounded range can turn CI red without a code change. Raise
# them on purpose, in a pull request that also fixes whatever the new version
# reports.
dev = [
  "pytest>=7.4",
  "ruff>=0.6,<0.17",
  "mypy>=1.11,<3",
  "types-requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/anatoli-iliev/openclaw-vercel-analytics"
Source = "https://github.com/anatoli-iliev/openclaw-vercel-analytics"
Issues = "https://github.com/anatoli-iliev/openclaw-vercel-analytics/issues"

# The skill ships as a single standalone script under scripts/, not as an
# importable package. The build backend exists only so that `pip install -e .`
# can resolve the dev extra; it is told to package nothing.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]
ignore = [
  # Every zip() in the script pairs sequences that are built from one another
  # in the same function, so the lengths cannot diverge and `strict=` would
  # only add noise.
  "B905",
  # An if/else block is often clearer than a ternary for the multi-line
  # branches this codebase uses.
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
# The test module puts scripts/ on sys.path before importing the script under
# test, so its import cannot sit at the top of the file.
"tests/*" = ["E402"]

[tool.mypy]
strict = true
python_version = "3.10"
# The script is not an installed package; point mypy at its directory so that
# `import vercel_analytics` from the tests resolves.
mypy_path = "scripts"
files = ["scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
